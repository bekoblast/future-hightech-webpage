<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#16345D"/>
  <!-- F (white) — stylized E-style with 3 horizontal bars -->
  <g fill="#ffffff">
    <rect x="11" y="16" width="16" height="6"/>
    <rect x="11" y="16" width="6"  height="32"/>
    <rect x="11" y="29" width="13" height="5"/>
  </g>
  <!-- H (orange) — block style -->
  <g fill="#EF6822">
    <rect x="34" y="16" width="6"  height="32"/>
    <rect x="47" y="16" width="6"  height="32"/>
    <rect x="34" y="29" width="19" height="6"/>
  </g>
</svg>
